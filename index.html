<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='15' fill='black'/><path d='M30 35h40' stroke='red' stroke-width='8' stroke-linecap='round'/><path d='M30 50h40' stroke='lime' stroke-width='8' stroke-linecap='round'/><path d='M30 65h25' stroke='yellow' stroke-width='8' stroke-linecap='round'/></svg>">
	<meta name="theme-color" content="#006eff">	
	<link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header id="header">
    <div id="titleWrapper">
        <h2 id="appTitle" contenteditable="true">Gestor de Targetes</h2>
        <button id="workspaceSelectorBtn" class="iconBtn">▾</button>
        <div id="workspaceDropdown" class="hidden"></div>
    </div>

    <div id="driveSyncStatus" class="driveSyncStatus" role="status" aria-live="polite">
        <span class="driveSyncStatusDot"></span>
        <span class="driveSyncStatusText">Només local</span>
    </div>

    <div id="extraMenuContainer">
        <button id="extraMenuBtn" class="iconHeader">⚙</button>
        <div id="extraMenu" class="hidden">
            <button id="toggleDarkMode" class="menuItem">Mode fosc</button>
            <button id="exportBtn" class="menuItem">Exportar</button>
            <button id="importBtn" class="menuItem">Importar</button>
            <button id="googleLoginBtn" class="menuItem">Connectar</button>
            <button id="googleLogoutBtn" class="menuItem hidden">Desconnectar</button>
        </div>
    </div>
</header>



<!-- TOP BAR -->
<div id="topBar">
    <div id="columnSliderWrapper">
        <label for="columnSlider">Columnes:</label>
        
        <input type="range" id="columnSlider" min="1" max="5" value="5" step="1">

        <div id="columnSliderLabels">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>Auto</span>
        </div>
    </div>

    <button id="toggleAllBtn" class="btnSecondary">▾ Obrir totes</button>
    <button id="addBtn" class="btnPrimary">+ Nova</button>
    <div id="searchWrapper">
            <button id="searchToggleBtn" class="iconBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                </svg>
            </button>

            <input id="searchInput" type="text" placeholder="Buscar..." class="hidden">
        </div>
</div>



<!-- FILTRES -->
<div id="tagFilterWrapper">
    <button id="clearFilters" class="btnDanger smallBtn">✖ Filtres</button>
    <div id="tagFilterContainer"></div>
</div>


<!-- PANEL AFEGIR TARGETA -->
<div id="addPanel" class="panel hidden">

    <div class="panelHeader">
        <h3>Nova targeta</h3>
        <button id="closeAdd" class="closeBtn">✖</button>
    </div>

    <label>Títol</label>
    <input id="newTitle">

    <label>Etiquetes</label>

    <div id="tagInputWrapper">
        <input id="newTags" placeholder="Escriu etiquetes separades per comes...">

        <div id="tagSuggestions" class="hidden"></div>
        <div id="tagAutocomplete" class="hidden"></div>
    </div>

    <label>Contingut</label>
    <textarea id="newContent" rows="4"></textarea>

    <div id="lastCardColorInfo" title="Últim color escollit per una card">
        <span>Últim color escollit:</span>
        <div id="lastCardColorDot" class="selectedColorDot"></div>
        <strong id="lastCardColorHex">-</strong>
    </div>

    <label>Color</label>
    <div id="addColorSelector" class="colorSelector">
        <div id="selectedAddColor" class="selectedColorDot"></div>
        <span>Canvia el color</span>
    </div>

    <div id="addColorPalette" class="palette hidden"></div>

    <button id="createCardBtn" class="btnPrimary">Afegir</button>
</div>


<!-- CONTENIDOR DE TARGETES -->
<div id="cardContainer"></div>


<!-- MODAL FULLSCREEN EDITABLE -->
<div id="cardModal" class="modal hidden">

    <div id="modalBackdrop"></div>

    <div id="modalContent">

        <div id="modalHeader">
            <h3 id="modalTitleDisplay"></h3>
            <button id="modalClose" class="closeBtn">✖</button>
        </div>

        <div id="modalTagsWrapper">
            <label>Etiquetes</label>
            <input id="modalTags">
        </div>

        <div id="modalContentWrapper">
            <label>Contingut</label>
            <div id="modalTextToolbar" class="richTextToolbar" aria-label="Eines de format"></div>
            <div id="modalText" class="richTextEditor" contenteditable="true" role="textbox" aria-multiline="true"></div>
        </div>

        <div id="modalColorSection">
            <label>Color</label>
            <div id="modalColorSelector" class="colorSelector">
                <div id="modalColorDot" class="selectedColorDot"></div>
                <span>Canvia el color</span>
            </div>
            <div id="modalColorPalette" class="palette hidden"></div>
        </div>

        <div id="modalButtons">
            <button id="modalSave" class="btnPrimary">Guardar</button>
        </div>

    </div>
</div>


<!-- INPUT OCULT PER IMPORTAR -->
<input type="file" id="importFileInput" accept="application/json" class="hidden">


<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="script.js"></script>


</body>
</html>
